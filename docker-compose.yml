services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aquagrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquagrow}
      POSTGRES_DB: ${POSTGRES_DB:-aquagrow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aquagrow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aquagrow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aquagrow}
      POSTGRES_DB: ${POSTGRES_DB:-aquagrow}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-32-chars-min-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MOCK_SENSORS: ${MOCK_SENSORS:-true}
      MOCK_INTERVAL_MS: ${MOCK_INTERVAL_MS:-5000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    # On first boot, apply schema and seed inside the container then start the server.
    command: >
      sh -c "node -e \"const{Pool}=require('pg');new Pool({host:process.env.POSTGRES_HOST,user:process.env.POSTGRES_USER,password:process.env.POSTGRES_PASSWORD,database:process.env.POSTGRES_DB}).query(require('fs').readFileSync('dist/db/schema.sql','utf-8')).then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1)})\" && node dist/index.js"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
